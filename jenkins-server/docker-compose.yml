services:
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:2.568.3-lts-jdk21}
    container_name: ${JENKINS_CONTAINER_NAME:-jenkins-server}
    restart: unless-stopped
    ports:
      - "${JENKINS_BIND_IP:-127.0.0.1}:${JENKINS_HTTP_PORT:-80}:8080"
      - "${JENKINS_BIND_IP:-127.0.0.1}:${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JAVA_OPTS: >-
        -Djava.awt.headless=true
        -Djenkins.install.runSetupWizard=${RUN_SETUP_WIZARD:-true}
      JENKINS_OPTS: --httpPort=8080
    volumes:
      - type: bind
        source: ${JENKINS_HOME_HOST:-./jenkins_home}
        target: /var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${JENKINS_MEM_LIMIT:-2g}

  agent:
    build:
      context: ./agent
    image: ${JENKINS_AGENT_IMAGE:-platform/jenkins-agent:local}
    container_name: ${JENKINS_AGENT_CONTAINER_NAME:-jenkins-agent}
    restart: unless-stopped
    user: root
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: ${JENKINS_NODE_NAME:-executor-cluster-local}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:?chay scripts/jenkins-jobs.py node de lay secret roi ghi vao .env}
      JENKINS_WEB_SOCKET: "true"
    volumes:
      - agent-workdir:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBECONFIG_HOST:-~/.kube/config}:/home/jenkins/.kube/config:ro
    extra_hosts:
      - "kubernetes.docker.internal:host-gateway"
    depends_on:
      jenkins:
        condition: service_healthy

volumes:
  agent-workdir:
