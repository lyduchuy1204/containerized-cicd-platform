apiVersion: v1
kind: ConfigMap
metadata:
  name: product-media-config
  labels:
    app.kubernetes.io/part-of: product-media
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  QUEUE_NAME: "media-processing"
  REDIS_URL: "redis://redis:6379"
  UPLOADS_DIR: "/uploads"
  MAX_UPLOAD_BYTES: "524288000"
  MEDIA_RETENTION_HOURS: "24"
  EXPIRY_SWEEP_INTERVAL_MINUTES: "15"
  GRAPHQL_PLAYGROUND: "false"
  PORT: "3000"
  TMP_DIR: "/tmp/uploads"
  SCRATCH_DIR: "/scratch"
  WORKER_CONCURRENCY: "1"
  LEASE_DURATION_SECONDS: "120"
  LEASE_RENEW_INTERVAL_SECONDS: "30"
  MAX_ATTEMPTS: "3"
  TRANSCODE_TIMEOUT_SECONDS: "1800"
  MAX_INPUT_BYTES: "524288000"
  MAX_DURATION_SECONDS: "600"
  FFMPEG_PRESET: "veryfast"
  FFMPEG_THREADS: "0"
  THUMBNAIL_TIMESTAMP: "00:00:01"
