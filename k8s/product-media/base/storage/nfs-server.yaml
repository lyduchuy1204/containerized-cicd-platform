apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-backing
  labels:
    app.kubernetes.io/name: nfs-server
    app.kubernetes.io/part-of: product-media
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  labels:
    app.kubernetes.io/name: nfs-server
    app.kubernetes.io/part-of: product-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-server
        app.kubernetes.io/part-of: product-media
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:12
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - name: nfs
              containerPort: 2049
          securityContext:
            privileged: true
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: backing
              mountPath: /exports
      volumes:
        - name: backing
          persistentVolumeClaim:
            claimName: nfs-backing
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  labels:
    app.kubernetes.io/name: nfs-server
    app.kubernetes.io/part-of: product-media
spec:
  type: ClusterIP
  clusterIP: 10.96.0.200
  selector:
    app.kubernetes.io/name: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
