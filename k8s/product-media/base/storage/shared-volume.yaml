apiVersion: v1
kind: PersistentVolume
metadata:
  name: product-media-uploads
  labels:
    app.kubernetes.io/name: product-media-uploads
    app.kubernetes.io/part-of: product-media
spec:
  capacity:
    storage: 8Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: product-media-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: "10.96.0.200"
    path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-media-uploads
  labels:
    app.kubernetes.io/name: product-media-uploads
    app.kubernetes.io/part-of: product-media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: product-media-nfs
  volumeName: product-media-uploads
  resources:
    requests:
      storage: 8Gi
