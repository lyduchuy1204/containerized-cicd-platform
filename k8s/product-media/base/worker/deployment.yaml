apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: product-media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: product-media
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: localhost:5000/product-media/worker:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: product-media-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-media-db
                  key: DATABASE_URL
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: 2000m
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: uploads
              mountPath: /uploads
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: product-media-uploads
        - name: scratch
          emptyDir: {}
