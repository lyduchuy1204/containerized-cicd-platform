apiVersion: batch/v1
kind: Job
metadata:
  name: api-migration
  labels:
    app.kubernetes.io/name: api-migration
    app.kubernetes.io/part-of: product-media
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migration
        app.kubernetes.io/part-of: product-media
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migration
          image: public.ecr.aws/e2k8v4q1/product-media/api:placeholder
          imagePullPolicy: Always
          command: ["npm", "run", "migration:run:prod"]
          envFrom:
            - configMapRef:
                name: product-media-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-media-db
                  key: DATABASE_URL
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
