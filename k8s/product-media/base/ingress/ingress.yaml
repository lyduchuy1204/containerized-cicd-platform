apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-media
  labels:
    app.kubernetes.io/part-of: product-media
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: portal
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 8080
