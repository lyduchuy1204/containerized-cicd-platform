apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: product-media-staging

resources:
  - namespace.yaml
  - ../../base

images:
  - name: localhost:5000/product-media/api
    newTag: staging
  - name: localhost:5000/product-media/portal
    newTag: staging
  - name: localhost:5000/product-media/worker
    newTag: staging

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: portal
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
